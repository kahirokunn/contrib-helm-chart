name: Publish Helm chart to GHCR

on:
  push:
    branches:
      - master
    tags:
      - 'redash-*'
    paths:
      - 'charts/redash/**'
      - '.github/workflows/publish-oci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: charts/redash
  OCI_REGISTRY: ghcr.io
  OCI_NAMESPACE: charts

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repositories
        shell: bash
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Read and validate chart version
        id: chart
        shell: bash
        run: |
          chart_name="$(helm show chart "$CHART_PATH" | sed -n 's/^name:[[:space:]]*//p')"
          chart_version="$(helm show chart "$CHART_PATH" | sed -n 's/^version:[[:space:]]*//p')"

          if [[ -z "$chart_name" || -z "$chart_version" ]]; then
            echo "Could not read the chart name and version from $CHART_PATH/Chart.yaml" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_tag="${chart_name}-${chart_version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match Chart.yaml; expected $expected_tag" >&2
              exit 1
            fi
          fi

          echo "name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"

      - name: Build dependencies and lint chart
        shell: bash
        run: |
          helm dependency build "$CHART_PATH"
          helm lint "$CHART_PATH"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login "$OCI_REGISTRY" \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Resolve OCI reference
        id: registry
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          target="oci://${OCI_REGISTRY}/${owner}/${OCI_NAMESPACE}"
          reference="${target}/${CHART_NAME}"

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          if helm show chart "$reference" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$reference:$CHART_VERSION is already published; skipping the push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        if: steps.registry.outputs.exists != 'true'
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" --destination dist
          test -f "dist/${CHART_NAME}-${CHART_VERSION}.tgz"

      - name: Push chart
        if: steps.registry.outputs.exists != 'true'
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          OCI_TARGET: ${{ steps.registry.outputs.target }}
        shell: bash
        run: |
          chart_package="dist/${CHART_NAME}-${CHART_VERSION}.tgz"
          helm push "$chart_package" "$OCI_TARGET"

      - name: Verify published chart
        env:
          CHART_REFERENCE: ${{ steps.registry.outputs.reference }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        shell: bash
        run: |
          helm show chart "$CHART_REFERENCE" --version "$CHART_VERSION"

      - name: Write job summary
        env:
          CHART_REFERENCE: ${{ steps.registry.outputs.reference }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.exists }}
        shell: bash
        run: |
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            action="Already published"
          else
            action="Published"
          fi
          echo "$action \`${CHART_REFERENCE}:${CHART_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
